name: Add a paper
description: Suggest a parameter-space ES or ZO paper for LLMs
title: "[Paper] "
labels:
  - paper
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Primary paper URL
      description: Prefer arXiv, ACL Anthology, OpenReview, PMLR, or the publisher page.
    validations:
      required: true
  - type: input
    id: code_url
    attributes:
      label: Official code URL
      description: Leave blank only if no implementation can be verified.
  - type: dropdown
    id: family
    attributes:
      label: Family
      options:
        - ES — single-turn reasoning/alignment
        - ES — multi-turn/agentic reasoning
        - ES — understanding/analysis
        - ZO — single-turn SFT/adaptation
        - ZO — multi-turn agent adaptation
        - ZO — understanding/systems
    validations:
      required: true
  - type: textarea
    id: datasets
    attributes:
      label: Representative datasets
      description: List the main training and evaluation datasets used by the paper.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Scope justification
      description: Explain what persistent model parameters are optimized and how ES/ZO is used.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that this paper is not already listed.
          required: true
        - label: The link points to a primary source.
          required: true
        - label: This is not prompt, reasoning-state, candidate-answer, skill, or memory evolution.
          required: true
