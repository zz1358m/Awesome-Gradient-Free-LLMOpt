name: Catalog consistency

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-generated-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check bilingual tables
        run: python3 scripts/generate_catalog.py --check
